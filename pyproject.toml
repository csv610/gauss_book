[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gauss"
version = "1.0.0"
description = "Implementations of Gauss's mathematical algorithms"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
